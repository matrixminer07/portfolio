<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Node Not Found | Spandan Roy</title>
    <meta name="description" content="The requested route does not exist on this cluster." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fira+Code:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #030303;
        color: #f1eee8;
        font-family: 'DM Sans', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .grid {
        position: fixed;
        inset: 0;
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(241, 238, 232, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(241, 238, 232, 0.03) 1px, transparent 1px);
        pointer-events: none;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: rgba(14, 14, 17, 0.85);
        border: 1px solid rgba(241, 238, 232, 0.12);
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        position: relative;
        z-index: 10;
      }
      .eyebrow {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #ff8c59;
        margin-bottom: 12px;
      }
      h1 {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-size: 64px;
        line-height: 1;
        color: #f1eee8;
        margin-bottom: 12px;
      }
      p {
        color: #aaa9a4;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        border-radius: 9999px;
        background: #f1eee8;
        color: #030303;
        text-decoration: none;
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: background-color 0.2s, transform 0.2s;
      }
      .btn:hover {
        background: #ff8c59;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="card">
      <div class="eyebrow">// HTTP 404 // ROUTE UNRESOLVED</div>
      <h1>Page Not Found</h1>
      <p>The requested endpoint does not exist on this cluster or was moved during recent architecture refinement.</p>
      <a href="/" class="btn">Return to Portfolio &rarr;</a>
    </div>
  </body>
</html>
